name: Upload companion apps to App Store Connect

# The seven Pippa companion apps (Soli, Kipi, Momo, Lumi, Rumi, Miya, Nomi).
# They live in pippa-mono's Apps/ XcodeGen project (AppFamily), one scheme per
# app. Bundle id and scheme come from contracts/product-registry/release.json
# on main, so nothing here has to change when an id does.
#
# The Nuro-side structured apps (Vela, Aven, Onda, Sero, Talo, Elio, Aster)
# are on hold and deliberately not listed.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to upload (all = the seven in parallel)
        required: true
        default: all
        type: choice
        options:
          - all
          - soli
          - kipi
          - momo
          - lumi
          - rumi
          - miya
          - nomi
      marketing_version:
        description: Version shown on the App Store (bump once a version is approved)
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  select:
    name: Select apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Build the app matrix
        id: matrix
        env:
          APP: ${{ inputs.app }}
        run: |
          ALL='["soli","kipi","momo","lumi","rumi","miya","nomi"]'
          if [ "$APP" = all ]; then apps="$ALL"; else apps="[\"$APP\"]"; fi
          echo "value=$(jq -c '{app: .}' <<< "$apps")" >> "$GITHUB_OUTPUT"

  build-and-upload:
    name: ${{ matrix.app }}
    needs: select
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    concurrency:
      group: companion-app-store-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      APP: ${{ matrix.app }}
      TEAM_ID: L6LUXM357X
      MARKETING_VERSION: ${{ inputs.marketing_version }}

    steps:
      # A plain clone, not actions/checkout: checkout's ssh credential cleanup
      # walks submodules, and stray gitlinks under .claude/worktrees/ on main
      # make that pass exit 128 (see deploy-all-websites.yml).
      - name: Check out private application source
        env:
          DEPLOY_KEY: ${{ secrets.PIPPA_MONO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" \
            git clone --depth 1 --branch main --no-recurse-submodules \
            git@github.com:asrayg/pippa-mono.git source
          rm -f "$key"
          git -C source log -1 --format='Building %h %s'

      - name: Read the app from the release registry
        working-directory: source
        run: |
          set -euo pipefail
          REG=contracts/product-registry/release.json
          BUNDLE_ID=$(jq -er --arg a "$APP" '.products[$a].ios.bundle_id' "$REG")
          SCHEME=$(jq -er --arg a "$APP" '.products[$a].ios.scheme' "$REG")
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "$APP: $SCHEME ($BUNDLE_ID) $MARKETING_VERSION"

      - name: Select and verify Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -qE 'iphoneos2[6-9]'

      - name: Install XcodeGen
        run: brew install xcodegen

      # The team's existing Apple Distribution certificate (same secret as the
      # Pippa and Nuro pipelines). Required here: without it Xcode would try to
      # create a certificate, and the account is at its cap.
      - name: Install the distribution certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$BUILD_CERT_P12" ]; then
            echo "::error::BUILD_CERT_P12 is required."
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          printf '%s' "$BUILD_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$BUILD_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          # The serial lets the profile step pick this exact certificate.
          SERIAL=$(security find-certificate -c "Apple Distribution" -p "$KC" \
            | openssl x509 -noout -serial | cut -d= -f2 | tr 'a-f' 'A-F' | sed 's/^0*//')
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "AUTH_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      # The App Store profile. A <APP>_APP_STORE_PROFILE secret (base64) wins
      # when set. Otherwise the profile is made through the App Store Connect
      # API on every run: the bundle id's capabilities are switched on first
      # (push for all seven, HealthKit for Kipi) and the runner's previous
      # profile is replaced, so the profile always carries every capability the
      # entitlements file asks for. Profiles are not capped; certificates are,
      # and this never creates one.
      - name: Install the App Store provisioning profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PROFILE_SECRET: ${{ secrets[format('{0}_APP_STORE_PROFILE', matrix.app)] }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          case "$APP" in kipi) CAPS="PUSH_NOTIFICATIONS HEALTHKIT" ;; *) CAPS="PUSH_NOTIFICATIONS" ;; esac

          if [ -n "${PROFILE_SECRET:-}" ]; then
            echo "Using the $(echo "$APP" | tr a-z A-Z)_APP_STORE_PROFILE secret."
            printf '%s' "$PROFILE_SECRET" | base64 -d > "$PROFILE"
          else
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            now=$(date +%s)
            header=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$ASC_KEY_ID" | b64url)
            payload=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$ASC_ISSUER_ID" "$now" "$((now + 900))" | b64url)
            sig=$(printf '%s' "$header.$payload" | openssl dgst -sha256 -sign "$AUTH_KEY_PATH" \
              | ruby -ropenssl -e 'sig = OpenSSL::ASN1.decode(STDIN.binmode.read); print sig.value.map { |i| i.value.to_s(2).rjust(32, "\0") }.join' \
              | b64url)
            TOKEN="$header.$payload.$sig"
            API=https://api.appstoreconnect.apple.com/v1
            req() { curl --fail-with-body --silent --show-error -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }

            BID=$(req "$API/bundleIds?filter%5Bidentifier%5D=$BUNDLE_ID&limit=50" \
              | jq -r --arg id "$BUNDLE_ID" '[.data[] | select(.attributes.identifier == $id)][0].id // empty')
            if [ -z "$BID" ]; then
              echo "Bundle id $BUNDLE_ID not registered yet; registering it."
              BID=$(req -X POST "$API/bundleIds" -d "$(jq -n --arg id "$BUNDLE_ID" --arg n "$SCHEME" \
                '{data:{type:"bundleIds",attributes:{identifier:$id,name:$n,platform:"IOS"}}}')" | jq -er '.data.id')
            fi

            HAVE=$(req "$API/bundleIds/$BID/bundleIdCapabilities" | jq -r '[.data[].attributes.capabilityType] | join(" ")')
            for CAP in $CAPS; do
              if [[ " $HAVE " == *" $CAP "* ]]; then echo "$CAP already on."; continue; fi
              echo "Turning on $CAP for $BUNDLE_ID."
              req -X POST "$API/bundleIdCapabilities" -d "$(jq -n --arg c "$CAP" --arg b "$BID" \
                '{data:{type:"bundleIdCapabilities",attributes:{capabilityType:$c},relationships:{bundleId:{data:{type:"bundleIds",id:$b}}}}}')" >/dev/null
            done

            CID=$(req "$API/certificates?filter%5BcertificateType%5D=DISTRIBUTION,IOS_DISTRIBUTION&limit=200" \
              | jq -r --arg s "$CERT_SERIAL" '[.data[] | select((.attributes.serialNumber | ascii_upcase | ltrimstr("0")) == $s)][0].id // empty')
            if [ -z "$CID" ]; then
              echo "::error::The BUILD_CERT_P12 certificate (serial $CERT_SERIAL) is not on the team's certificate list."
              exit 1
            fi

            NAME="$SCHEME App Store (release runner)"
            for OLD in $(req "$API/profiles?filter%5Bname%5D=$(jq -rn --arg n "$NAME" '$n|@uri')&limit=50" | jq -r '.data[].id'); do
              req -X DELETE "$API/profiles/$OLD" >/dev/null && echo "Replaced profile $OLD."
            done
            req -X POST "$API/profiles" -d "$(jq -n --arg n "$NAME" --arg b "$BID" --arg c "$CID" \
              '{data:{type:"profiles",attributes:{name:$n,profileType:"IOS_APP_STORE"},relationships:{bundleId:{data:{type:"bundleIds",id:$b}},certificates:{data:[{type:"certificates",id:$c}]}}}}')" \
              | jq -er '.data.attributes.profileContent' | base64 -d > "$PROFILE"
          fi

          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE" > "$PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")
          if [ "$APP_ID" != "$TEAM_ID.$BUNDLE_ID" ]; then
            echo "::error::Profile is for $APP_ID, expected $TEAM_ID.$BUNDLE_ID."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          rm -f "$PLIST" "$PROFILE"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Profile: $NAME ($UUID)"

      # Distribution signing goes on the app target only. Passing it on the
      # xcodebuild command line would also hit the brand static libraries and
      # the PippaPlatform package, which refuse a provisioning profile. So a
      # small spec that includes project.yml overrides just the app target's
      # signing (XcodeGen merges included specs, the including one winning);
      # the repository keeps automatic signing for local builds.
      - name: Generate the Xcode project with distribution signing
        working-directory: source/Apps
        run: |
          set -euo pipefail
          cat > ci-signing.yml <<EOF
          include: [project.yml]
          settings:
            base:
              DEVELOPMENT_TEAM: $TEAM_ID
          targets:
            $SCHEME:
              settings:
                base:
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: $TEAM_ID
                  CODE_SIGN_IDENTITY: Apple Distribution
                  PROVISIONING_PROFILE_SPECIFIER: "$PROFILE_NAME"
          EOF
          xcodegen generate --spec ci-signing.yml
          xcodebuild -project AppFamily.xcodeproj -target "$SCHEME" -configuration Release -showBuildSettings \
            | grep -E ' (CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER) ='

      - name: Archive ${{ matrix.app }} ${{ inputs.marketing_version }}
        working-directory: source/Apps
        run: |
          # Keep every build setting in the same continued command, with no
          # comments inside it (a comment after a backslash ends the command).
          xcodebuild archive \
            -project AppFamily.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_id }}"

      - name: Verify the archive kept its entitlements
        run: |
          APP_PATH="$RUNNER_TEMP/$SCHEME.xcarchive/Products/Applications/$SCHEME.app"
          ENT=$(codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || true)
          echo "$ENT"
          KEYS="aps-environment"
          [ "$APP" = kipi ] && KEYS="$KEYS com.apple.developer.healthkit"
          for KEY in $KEYS; do
            if ! echo "$ENT" | grep -q "$KEY"; then
              echo "::error::Archive is missing '$KEY' - refusing to upload."
              exit 1
            fi
          done
          echo "Entitlements present."

      - name: Export and upload ${{ matrix.app }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$OPTS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/$SCHEME-export" \
            -exportOptionsPlist "$OPTS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
