name: Upload Arfy to Google Play

# Arfy (Arfy-android/ in pippa-mono): the kids' food-play app,
# com.getpippa.app.Arfy, "free" flavor. No Firebase and no push.
# Signs with the app family's upload keystore, the same secrets as
# companion-android.yml.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name shown in Play
        required: true
        default: '1.0.0'
      version_code:
        description: Version code. Leave empty for 1000 + this workflow's run number, which always goes up.
        required: false
        default: ''
      track:
        description: Play track to publish to
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Release status on that track
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed
      upload:
        description: Upload to Play (off = build and keep the signed bundle only, for the first manual upload)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: arfy-play
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: arfy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-store
    env:
      PACKAGE: com.getpippa.app.Arfy
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE_INPUT: ${{ inputs.version_code }}

    steps:
      - name: Check out private application source
        env:
          DEPLOY_KEY: ${{ secrets.PIPPA_MONO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" \
            git clone --depth 1 --branch main --no-recurse-submodules \
            git@github.com:asrayg/pippa-mono.git source
          rm -f "$key"
          git -C source log -1 --format='Building %h %s'
          VERSION_CODE="${VERSION_CODE_INPUT:-$((1000 + ${{ github.run_number }}))}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "arfy: $PACKAGE $VERSION_NAME ($VERSION_CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-arfy-release-${{ hashFiles('source/Arfy-android/**/*.gradle*', 'source/Arfy-android/gradle/libs.versions.toml') }}
          restore-keys: gradle-arfy-release-

      - name: Install the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FAMILY_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FAMILY_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FAMILY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FAMILY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::FAMILY_ANDROID_KEYSTORE_BASE64 is not set. Play only accepts a signed bundle."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/family-upload.jks"
          chmod 600 "$RUNNER_TEMP/keys/family-upload.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keys/family-upload.jks"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the release bundle
        working-directory: source/Arfy-android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleFreeRelease --no-daemon --stacktrace \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"

      - name: Confirm the bundle is signed
        working-directory: source/Arfy-android
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/freeRelease/*.aab | head -1)
          ls -la "$AAB"
          echo "AAB=source/Arfy-android/$AAB" >> "$GITHUB_ENV"
          if ! unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "::error::$AAB is unsigned. Check the keystore secrets."
            exit 1
          fi

      - name: Upload to Google Play
        if: inputs.upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.FAMILY_PLAY_SERVICE_ACCOUNT_JSON || secrets.PIPPA_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE }}
          releaseFiles: ${{ env.AAB }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Keep the bundle for the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arfy-${{ inputs.version_name }}-${{ env.VERSION_CODE }}-aab
          path: source/Arfy-android/app/build/outputs/bundle/freeRelease/*.aab
          if-no-files-found: warn
          retention-days: 30
