name: Upload Pippa to App Store Connect

on:
  workflow_dispatch:

env:
  PIPPA_MARKETING_VERSION: "3.1.3"

permissions:
  contents: read

concurrency:
  group: pippa-app-store-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store

    steps:
      - name: Check out private application source
        uses: actions/checkout@v4
        with:
          repository: asrayg/pippa-mono
          ref: main
          path: source
          ssh-key: ${{ secrets.PIPPA_MONO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Select and verify Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -qE 'iphoneos2[6-9]'

      # Sign with the team's EXISTING distribution certificate instead of asking
      # Xcode to make one.
      #
      # A fresh runner has an empty keychain, so -allowProvisioningUpdates was
      # creating an Apple Distribution certificate on every first build. Apple
      # caps those per account, and once the cap is reached every archive fails
      # with "Choose a certificate to revoke" — which is not something a build
      # can resolve, and not something worth revoking a live signing identity
      # to clear. Importing the certificate removes the whole class of failure:
      # provisioning updates are still allowed, so Xcode can fetch or create
      # the PROFILE, which is not capped.
      #
      # Export it once from a Mac that has it: Keychain Access, right-click
      # "Apple Distribution: ...", Export, .p12, set a password. Then
      #   base64 -i cert.p12 | pbcopy
      # into the BUILD_CERT_P12 secret, and the password into
      # BUILD_CERT_PASSWORD.
      #
      # No-ops when the secrets are absent, so this workflow keeps working
      # exactly as before until they are set.
      - name: Install the distribution certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERT_P12" ]; then
            echo "BUILD_CERT_P12 not set - falling back to Xcode creating one."
            echo "If this build fails on the certificate cap, that is why."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          printf '%s' "$BUILD_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$BUILD_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign prompts for keychain access and hangs.
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC" >/dev/null
          # Put it on the search list AHEAD of the login keychain.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

      # Manual distribution signing needs the capability-bearing App Store
      # profile locally as well as the certificate. A profile made before a
      # capability is enabled is not sufficient: Xcode correctly refuses to
      # archive it because the signed app would lose that entitlement.
      - name: Install the Pippa App Store provisioning profile
        env:
          PIPPA_APP_STORE_PROFILE: ${{ secrets.PIPPA_APP_STORE_PROFILE }}
        run: |
          if [ -z "$PIPPA_APP_STORE_PROFILE" ]; then
            echo "::error::PIPPA_APP_STORE_PROFILE is required. Add the base64-encoded App Store profile for com.pippa.app (with Associated Domains, Push Notifications, and Sign in with Apple)."
            exit 1
          fi
          PROFILE="$RUNNER_TEMP/Pippa-AppStore.mobileprovision"
          printf '%s' "$PIPPA_APP_STORE_PROFILE" | base64 -d > "$PROFILE"
          PLIST="$RUNNER_TEMP/Pippa-AppStore-profile.plist"
          security cms -D -i "$PROFILE" > "$PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          rm -f "$PLIST" "$PROFILE"
          echo "PIPPA_APP_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Install the Pippa widget App Store provisioning profile
        env:
          PIPPA_WIDGET_APP_STORE_PROFILE: ${{ secrets.PIPPA_WIDGET_APP_STORE_PROFILE }}
        run: |
          if [ -z "$PIPPA_WIDGET_APP_STORE_PROFILE" ]; then
            echo "::error::PIPPA_WIDGET_APP_STORE_PROFILE is required. Add the base64-encoded App Store profile for com.pippa.app.dailycheckin with group.com.pippa.app."
            exit 1
          fi
          PROFILE="$RUNNER_TEMP/Pippa-Widget-AppStore.mobileprovision"
          printf '%s' "$PIPPA_WIDGET_APP_STORE_PROFILE" | base64 -d > "$PROFILE"
          PLIST="$RUNNER_TEMP/Pippa-Widget-AppStore-profile.plist"
          security cms -D -i "$PROFILE" > "$PLIST"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")
          GROUP=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups:0' "$PLIST")
          if [ "$APP_ID" != "L6LUXM357X.com.pippa.app.dailycheckin" ] || [ "$GROUP" != "group.com.pippa.app" ]; then
            echo "::error::Widget profile must be for com.pippa.app.dailycheckin with group.com.pippa.app."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          rm -f "$PLIST" "$PROFILE"
          echo "PIPPA_WIDGET_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "AUTH_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive Pippa ${{ env.PIPPA_MARKETING_VERSION }}
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Keep every build setting in the same continued command. A comment
          # between a trailing backslash and the next setting ends the command,
          # which silently falls back to development signing.
          xcodebuild archive \
            -project Pippa/Pippa.xcodeproj \
            -scheme Pippa \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Pippa.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=L6LUXM357X \
            MARKETING_VERSION="$PIPPA_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_id }}"

      - name: Verify the archive kept its entitlements
        run: |
          APP="$RUNNER_TEMP/Pippa.xcarchive/Products/Applications/Pippa.app"
          ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          echo "$ENT"
          # Archiving with CODE_SIGNING_ALLOWED=NO left the app unsigned, and the
          # export re-sign does NOT restore entitlements from the profile. Every
          # build shipped that way silently lost Sign in with Apple, push, and
          # universal links. Catch it here, before anything reaches Apple.
          for KEY in com.apple.developer.applesignin aps-environment; do
            if ! echo "$ENT" | grep -q "$KEY"; then
              echo "::error::Archive is missing '$KEY' - refusing to upload."
              exit 1
            fi
          done
          echo "Entitlements present."

      - name: Export and upload Pippa
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pippa.xcarchive" \
            -exportPath "$RUNNER_TEMP/Pippa-export" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
