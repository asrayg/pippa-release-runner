name: Upload Grove to App Store Connect

# Grove (Apps/Grove in pippa-mono's AppFamily XcodeGen project): the 18+
# sobriety garden app, com.getpippa.app.Grove (App Store id 6830765905).
# Same signing path as arfy-ios.yml, with two profiles: the app (push + the
# App Group group.com.getpippa.app.Grove) and its widget extension
# com.getpippa.app.Grove.widget (the App Group only). The App Group itself is
# assigned to both bundle ids in the developer portal; the API cannot do that.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Version shown on the App Store (bump once a version is approved)
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build-and-upload:
    name: grove
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store
    concurrency:
      group: grove-app-store
      cancel-in-progress: false
    env:
      APP: grove
      BUNDLE_ID: com.getpippa.app.Grove
      WIDGET_ID: com.getpippa.app.Grove.widget
      SCHEME: Grove
      WIDGET_SCHEME: GroveWidget
      APP_GROUP: group.com.getpippa.app.Grove
      TEAM_ID: L6LUXM357X
      MARKETING_VERSION: ${{ inputs.marketing_version }}

    steps:
      # A plain clone, not actions/checkout: checkout's ssh credential cleanup
      # walks submodules, and stray gitlinks under .claude/worktrees/ on main
      # make that pass exit 128 (see deploy-all-websites.yml).
      - name: Check out private application source
        env:
          DEPLOY_KEY: ${{ secrets.PIPPA_MONO_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          key="$(mktemp)"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" \
            git clone --depth 1 --branch main --no-recurse-submodules \
            git@github.com:asrayg/pippa-mono.git source
          rm -f "$key"
          git -C source log -1 --format='Building %h %s'

      - name: Select and verify Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -qE 'iphoneos2[6-9]'

      - name: Install XcodeGen
        run: brew install xcodegen

      # The team's existing Apple Distribution certificate (same secret as the
      # Pippa and Nuro pipelines). Required here: without it Xcode would try to
      # create a certificate, and the account is at its cap.
      - name: Install the distribution certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$BUILD_CERT_P12" ]; then
            echo "::error::BUILD_CERT_P12 is required."
            exit 1
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          printf '%s' "$BUILD_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$BUILD_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          # The serial lets the profile step pick this exact certificate.
          SERIAL=$(security find-certificate -c "Apple Distribution" -p "$KC" \
            | openssl x509 -noout -serial | cut -d= -f2 | tr 'a-f' 'A-F' | sed 's/^0*//')
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "AUTH_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      # The App Store profile. A <APP>_APP_STORE_PROFILE secret (base64) wins
      # when set. Otherwise the profile is made through the App Store Connect
      # API on every run: the bundle id's capabilities are switched on first
      # (push for all seven, HealthKit for Kipi) and the runner's previous
      # profile is replaced, so the profile always carries every capability the
      # entitlements file asks for. Profiles are not capped; certificates are,
      # and this never creates one.
      # Two App Store profiles, made through the App Store Connect API on every
      # run (the runner's previous ones are replaced). Each bundle id gets its
      # capabilities switched on first so the profile carries them.
      - name: Install the App Store provisioning profiles
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          now=$(date +%s)
          header=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$ASC_KEY_ID" | b64url)
          payload=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$ASC_ISSUER_ID" "$now" "$((now + 900))" | b64url)
          sig=$(printf '%s' "$header.$payload" | openssl dgst -sha256 -sign "$AUTH_KEY_PATH" \
            | ruby -ropenssl -e 'sig = OpenSSL::ASN1.decode(STDIN.binmode.read); print sig.value.map { |i| i.value.to_s(2).rjust(32, "\0") }.join' \
            | b64url)
          TOKEN="$header.$payload.$sig"
          API=https://api.appstoreconnect.apple.com/v1
          req() { curl --fail-with-body --silent --show-error -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }

          CID=$(req "$API/certificates?filter%5BcertificateType%5D=DISTRIBUTION,IOS_DISTRIBUTION&limit=200" \
            | jq -r --arg s "$CERT_SERIAL" '[.data[] | select((.attributes.serialNumber | ascii_upcase | ltrimstr("0")) == $s)][0].id // empty')
          if [ -z "$CID" ]; then
            echo "::error::The BUILD_CERT_P12 certificate (serial $CERT_SERIAL) is not on the team's certificate list."
            exit 1
          fi

          # make_profile <bundle id> <profile name> <env var for the name> <capabilities...>
          make_profile() {
            local ID="$1" NAME="$2" VAR="$3"; shift 3
            local BID HAVE PROFILE PLIST UUID APP_ID
            BID=$(req "$API/bundleIds?filter%5Bidentifier%5D=$ID&limit=50" \
              | jq -r --arg id "$ID" '[.data[] | select(.attributes.identifier == $id)][0].id // empty')
            if [ -z "$BID" ]; then
              echo "::error::Bundle id $ID is not registered (it needs its App Group assigned in the portal too)."
              exit 1
            fi
            HAVE=$(req "$API/bundleIds/$BID/bundleIdCapabilities" | jq -r '[.data[].attributes.capabilityType] | join(" ")')
            for CAP in "$@"; do
              if [[ " $HAVE " == *" $CAP "* ]]; then echo "$ID: $CAP already on."; continue; fi
              echo "$ID: turning on $CAP."
              req -X POST "$API/bundleIdCapabilities" -d "$(jq -n --arg c "$CAP" --arg b "$BID" \
                '{data:{type:"bundleIdCapabilities",attributes:{capabilityType:$c,settings:[]},relationships:{bundleId:{data:{type:"bundleIds",id:$b}}}}}')" >/dev/null
            done
            for OLD in $(req "$API/profiles?filter%5Bname%5D=$(jq -rn --arg n "$NAME" '$n|@uri')&limit=50" | jq -r '.data[].id'); do
              req -X DELETE "$API/profiles/$OLD" >/dev/null && echo "Replaced profile $OLD."
            done
            PROFILE="$RUNNER_TEMP/$VAR.mobileprovision"
            req -X POST "$API/profiles" -d "$(jq -n --arg n "$NAME" --arg b "$BID" --arg c "$CID" \
              '{data:{type:"profiles",attributes:{name:$n,profileType:"IOS_APP_STORE"},relationships:{bundleId:{data:{type:"bundleIds",id:$b}},certificates:{data:[{type:"certificates",id:$c}]}}}}')" \
              | jq -er '.data.attributes.profileContent' | base64 -d > "$PROFILE"
            PLIST="$RUNNER_TEMP/$VAR.plist"
            security cms -D -i "$PROFILE" > "$PLIST"
            UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")
            APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")
            if [ "$APP_ID" != "$TEAM_ID.$ID" ]; then
              echo "::error::Profile is for $APP_ID, expected $TEAM_ID.$ID."
              exit 1
            fi
            if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$PLIST" | grep -q "$APP_GROUP"; then
              echo "::error::Profile for $ID does not carry $APP_GROUP. Assign the App Group to $ID in the developer portal."
              exit 1
            fi
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
            rm -f "$PLIST" "$PROFILE"
            echo "$VAR=$NAME" >> "$GITHUB_ENV"
            echo "Profile: $NAME ($UUID)"
          }
          make_profile "$BUNDLE_ID" "Grove App Store (release runner)" PROFILE_NAME PUSH_NOTIFICATIONS APP_GROUPS
          make_profile "$WIDGET_ID" "Grove Widget App Store (release runner)" WIDGET_PROFILE_NAME APP_GROUPS

      # Distribution signing goes on the app and widget targets only (the brand
      # static library and the PippaPlatform package refuse a profile), through
      # a small spec that includes project.yml and overrides just those two.
      - name: Generate the Xcode project with distribution signing
        working-directory: source/Apps
        run: |
          set -euo pipefail
          cat > ci-signing.yml <<EOF
          include: [project.yml]
          settings:
            base:
              DEVELOPMENT_TEAM: $TEAM_ID
          targets:
            $SCHEME:
              settings:
                base:
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: $TEAM_ID
                  CODE_SIGN_IDENTITY: Apple Distribution
                  PROVISIONING_PROFILE_SPECIFIER: "$PROFILE_NAME"
            $WIDGET_SCHEME:
              settings:
                base:
                  CODE_SIGN_STYLE: Manual
                  DEVELOPMENT_TEAM: $TEAM_ID
                  CODE_SIGN_IDENTITY: Apple Distribution
                  PROVISIONING_PROFILE_SPECIFIER: "$WIDGET_PROFILE_NAME"
          EOF
          xcodegen generate --spec ci-signing.yml
          for T in "$SCHEME" "$WIDGET_SCHEME"; do
            xcodebuild -project AppFamily.xcodeproj -target "$T" -configuration Release -showBuildSettings \
              | grep -E ' (CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|PRODUCT_BUNDLE_IDENTIFIER) ='
          done

      - name: Archive Grove ${{ inputs.marketing_version }}
        working-directory: source/Apps
        run: |
          xcodebuild archive \
            -project AppFamily.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_id }}"

      - name: Verify the archive's identity and capabilities
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/$SCHEME.xcarchive/Products/Applications/$SCHEME.app"
          WIDGET_PATH="$APP_PATH/PlugIns/$WIDGET_SCHEME.appex"
          for P in "$APP_PATH" "$WIDGET_PATH"; do
            ENT=$(codesign -d --entitlements :- "$P" 2>/dev/null || true)
            echo "== $P"; echo "$ENT"
            echo "$ENT" | grep -q "$APP_GROUP" || { echo "::error::$P is missing $APP_GROUP."; exit 1; }
            if echo "$ENT" | grep -q "dev.appfamily"; then echo "::error::$P still carries a dev id."; exit 1; fi
          done
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")" = "$BUNDLE_ID" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET_PATH/Info.plist")" = "$WIDGET_ID" ]
          echo "Bundle ids and the App Group are as intended."

      - name: Export and upload Grove
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$OPTS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
              <key>$WIDGET_ID</key><string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportPath "$RUNNER_TEMP/$SCHEME-export" \
            -exportOptionsPlist "$OPTS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
