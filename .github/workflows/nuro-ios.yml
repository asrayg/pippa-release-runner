name: Upload Nuro to App Store Connect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuro-app-store-upload
  cancel-in-progress: false

# The marketing version ships from here, as an xcodebuild override, so it wins
# over whatever Nuro.xcodeproj carries. Bump this one value to cut a release.
env:
  NURO_MARKETING_VERSION: "1.0.3"

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-store

    steps:
      - name: Check out private application source
        uses: actions/checkout@v4
        with:
          repository: asrayg/pippa-mono
          ref: main
          path: source
          ssh-key: ${{ secrets.PIPPA_MONO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Select and verify Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26* 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          xcodebuild -showsdks | grep -qE 'iphoneos2[6-9]'

      # Sign with the team's EXISTING distribution certificate instead of asking
      # Xcode to make one.
      #
      # A fresh runner has an empty keychain, so -allowProvisioningUpdates was
      # creating an Apple Distribution certificate on every first build. Apple
      # caps those per account, and once the cap is reached every archive fails
      # with "Choose a certificate to revoke" — which is not something a build
      # can resolve, and not something worth revoking a live signing identity
      # to clear. Importing the certificate removes the whole class of failure:
      # provisioning updates are still allowed, so Xcode can fetch or create
      # the PROFILE, which is not capped.
      #
      # Export it once from a Mac that has it: Keychain Access, right-click
      # "Apple Distribution: ...", Export, .p12, set a password. Then
      #   base64 -i cert.p12 | pbcopy
      # into the BUILD_CERT_P12 secret, and the password into
      # BUILD_CERT_PASSWORD.
      #
      # No-ops when the secrets are absent, so this workflow keeps working
      # exactly as before until they are set.
      - name: Install the distribution certificate
        env:
          BUILD_CERT_P12: ${{ secrets.BUILD_CERT_P12 }}
          BUILD_CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERT_P12" ]; then
            echo "BUILD_CERT_P12 not set - falling back to Xcode creating one."
            echo "If this build fails on the certificate cap, that is why."
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          printf '%s' "$BUILD_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$BUILD_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign prompts for keychain access and hangs.
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC" >/dev/null
          # Put it on the search list AHEAD of the login keychain.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"

      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "AUTH_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Archive Nuro ${{ env.NURO_MARKETING_VERSION }}
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # Sign for distribution, explicitly.
          #
          # With only CODE_SIGN_STYLE=Automatic, the archive resolved to
          # DEVELOPMENT signing: the error named "iOS App Development
          # provisioning profiles", so Xcode ignored the Apple Distribution
          # certificate sitting in the keychain and tried to create a
          # development one instead, which is what hit the certificate cap.
          #
          # Naming the identity points it at the certificate that is already
          # there, leaving only the PROFILE to fetch or create, and profiles
          # are not capped.
          #
          # Every build setting has to stay in one continued command. These
          # comments used to sit BETWEEN a trailing backslash and
          # CODE_SIGN_IDENTITY, which ends the command there: the identity, the
          # team and both version overrides were never passed, so the fix the
          # comment describes never actually applied. Keep comments above the
          # xcodebuild line, never inside it.
          xcodebuild archive \
            -project Nuro/Nuro.xcodeproj \
            -scheme Nuro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nuro.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=L6LUXM357X \
            MARKETING_VERSION="$NURO_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_id }}"

      - name: Verify the archive kept its entitlements
        run: |
          APP="$RUNNER_TEMP/Nuro.xcarchive/Products/Applications/Nuro.app"
          ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          echo "$ENT"
          # Archiving with CODE_SIGNING_ALLOWED=NO left the app unsigned, and the
          # export re-sign does NOT restore entitlements from the profile. Every
          # build shipped that way silently lost Sign in with Apple, push, and
          # universal links. Catch it here, before anything reaches Apple.
          for KEY in com.apple.developer.applesignin aps-environment; do
            if ! echo "$ENT" | grep -q "$KEY"; then
              echo "::error::Archive is missing '$KEY' - refusing to upload."
              exit 1
            fi
          done
          echo "Entitlements present."

      - name: Export and upload Nuro
        working-directory: source
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Nuro.xcarchive" \
            -exportPath "$RUNNER_TEMP/Nuro-export" \
            -exportOptionsPlist ci/ExportOptions-Nuro.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
