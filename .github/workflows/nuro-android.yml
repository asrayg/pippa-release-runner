name: Upload Nuro to Google Play

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name shown in Play (e.g. 1.0.0)
        required: true
        default: '1.0.0'
      version_code:
        description: Version code. Must be higher than every previous upload.
        required: true
      track:
        description: Play track to publish to
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Release status on that track
        required: true
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: read

concurrency:
  group: nuro-play-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-store

    steps:
      - name: Check out private application source
        uses: actions/checkout@v4
        with:
          repository: asrayg/pippa-mono
          ref: main
          path: source
          ssh-key: ${{ secrets.PIPPA_MONO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-nuro-release-${{ hashFiles('source/Nuro-android/**/*.gradle*') }}
          restore-keys: gradle-nuro-release-

      # The upload keystore never touches the repository. It is held as a
      # base64 secret, written to the runner's temp dir, and referenced from
      # local.properties, which is what app/build.gradle.kts reads.
      - name: Install the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NURO_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NURO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NURO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NURO_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::NURO_ANDROID_KEYSTORE_BASE64 is not set. Play only accepts a signed bundle."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/nuro-upload.jks"
          chmod 600 "$RUNNER_TEMP/keys/nuro-upload.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/keys/nuro-upload.jks"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> source/Nuro-android/local.properties

      - name: Build the release bundle
        working-directory: source/Nuro-android
        run: |
          ./gradlew :app:bundleRelease --no-daemon --stacktrace \
            -PversionCode=${{ inputs.version_code }} \
            -PversionName=${{ inputs.version_name }}

      - name: Confirm the bundle is signed
        working-directory: source/Nuro-android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          # An unsigned bundle uploads and is then rejected by Play with a much
          # less obvious error, so fail here instead.
          if ! unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|DSA|EC)'; then
            echo "::error::app-release.aab is unsigned. Check the keystore secrets."
            exit 1
          fi

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.NURO_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nuro.app
          releaseFiles: source/Nuro-android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}

      - name: Keep the bundle for the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuro-${{ inputs.version_name }}-${{ inputs.version_code }}-aab
          path: source/Nuro-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
